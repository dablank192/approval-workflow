name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore approval-workflow.slnx

      - name: Build
        run: dotnet build approval-workflow.slnx --configuration Release --no-restore

      # Testcontainers starts and disposes its own PostgreSQL container.
      - name: Run tests
        env:
          # Public test-only key; never use this value outside CI.
          Jwt__Secret: approval-workflow-ci-only-signing-key-0123456789abcdef
        run: >-
          dotnet test tests/ApprovalWorkflow.Tests/ApprovalWorkflow.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7
